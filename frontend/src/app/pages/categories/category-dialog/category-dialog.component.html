<h2 mat-dialog-title>{{ isEditMode ? 'Edit Category' : 'Add Category' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Category Name</mat-label>
      <input matInput formControlName="name" autocomplete="off" />
      @if (name.touched && name.hasError('required')) {
        <mat-error>Category name is required</mat-error>
      }
      @if (name.touched && name.hasError('maxlength')) {
        <mat-error>Category name must be under 150 characters</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-raised-button color="primary" type="submit">
      {{ isEditMode ? 'Save Changes' : 'Add Category' }}
    </button>
  </mat-dialog-actions>
</form>
