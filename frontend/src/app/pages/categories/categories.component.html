<div class="categories-page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Categories</h1>
      <p class="page-subtitle">Manage your product categories</p>
    </div>
    <button mat-raised-button color="primary" (click)="openAddDialog()">
      <mat-icon>add</mat-icon>
      Add Category
    </button>
  </div>

  <div class="toolbar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search categories</mat-label>
      <input matInput [formControl]="searchControl" placeholder="Search by name" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="table-wrapper">
    @if (loading()) {
      <div class="loading-row">
        <mat-spinner diameter="32"></mat-spinner>
      </div>
    } @else {
      <table mat-table [dataSource]="categories()" class="mat-elevation-z1">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let category">{{ category.id }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let category">{{ category.name }}</td>
        </ng-container>

        <ng-container matColumnDef="created_at">
          <th mat-header-cell *matHeaderCellDef>Created</th>
          <td mat-cell *matCellDef="let category">{{ category.created_at | date: 'medium' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let category">
            <button mat-icon-button matTooltip="Edit" (click)="openEditDialog(category)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button matTooltip="Delete" color="warn" (click)="confirmDelete(category)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      @if (categories().length === 0) {
        <div class="empty-state">
          <mat-icon>category</mat-icon>
          <p>No categories found</p>
        </div>
      }
    }
  </div>
</div>
